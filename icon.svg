<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="core" cx="42%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#e0f7ff"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a16"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g filter="url(#glow)" fill="none" stroke-width="10" opacity="0.92">
    <ellipse cx="256" cy="256" rx="186" ry="76" stroke="#8b5cf6"/>
    <ellipse cx="256" cy="256" rx="186" ry="76" stroke="#06b6d4" transform="rotate(60 256 256)"/>
    <ellipse cx="256" cy="256" rx="186" ry="76" stroke="#ec4899" transform="rotate(120 256 256)"/>
  </g>

  <circle cx="256" cy="256" r="58" fill="url(#core)" filter="url(#glow)"/>

  <g fill="#e0f2fe" filter="url(#glow)">
    <circle cx="442" cy="256" r="15"/>
    <circle cx="163" cy="94" r="15"/>
    <circle cx="163" cy="418" r="15"/>
  </g>
</svg>
